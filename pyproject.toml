[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackinsights-common"
version = "0.1.0"
description = "Shared library for the Track Insights web app and standalone data-processing programs."
requires-python = ">=3.10"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
web = [
    "Flask",
    "Flask-SQLAlchemy",
    "Pillow",      # paints the athlete card PNGs and the logo silhouettes
    "numpy",       # card gradients and washes
]
standalone = [
    "requests",
    "beautifulsoup4",
    "fuzzywuzzy",
    "python-Levenshtein",
    "matplotlib",
    "seaborn",
    "jupyter",
    "ipykernel",
    "Pillow",
    "svglib",
    "reportlab",
    "rlPyCairo",
]
cards = [
    "Pillow",      # kept so an older `pip install -e ".[cards]"` still works; web covers it
    "numpy",
]
dev = [
    "pytest",
    "markdown",  # docs/make_pdf.py -- turns a guide into a PDF to hand out
]

[tool.setuptools]
packages = ["common"]
